<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f4">
  <title>Divisor de conta</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202927;
      background: #f3f5f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 32px 18px; }
    main { width: min(100%, 920px); }
    .heading { margin: 0 0 26px; }
    .eyebrow { color: #48786e; font-size: .74rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2.1rem, 6vw, 3rem); letter-spacing: -.055em; }
    .heading p:last-child { margin: 0; color: #76817d; line-height: 1.6; }

    .calculator {
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid #e0e6e2;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px #1e3b2b0d;
    }

    .fields { display: grid; gap: 24px; padding: clamp(24px, 5vw, 42px); }
    .field { display: grid; gap: 9px; }
    label { color: #47534e; font-size: .88rem; font-weight: 700; }
    .input-wrap { display: flex; align-items: center; border: 1px solid #dfe5e1; border-radius: 12px; }
    .input-wrap:focus-within { outline: 3px solid #c6e0d7; outline-offset: 2px; }
    .prefix, .suffix { padding: 0 13px; color: #88938d; }
    input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 14px 12px;
      border: 0;
      border-radius: 12px;
      outline: 0;
      color: #202927;
      font: inherit;
      font-size: 1.1rem;
    }
    .tip-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .tip-option {
      min-width: 61px;
      padding: 10px 14px;
      border: 1px solid #dfe5e1;
      border-radius: 10px;
      background: #fff;
      color: #53605a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .tip-option[aria-pressed="true"] { border-color: #397c67; background: #e9f4ef; color: #276650; }
    .tip-option:focus-visible, input:focus-visible { outline: 3px solid #c6e0d7; outline-offset: 2px; }

    .result {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
      padding: clamp(24px, 5vw, 42px);
      background: #183b32;
      color: #fff;
    }
    .result-label { margin: 0 0 5px; color: #b7cec5; font-size: .85rem; }
    .amount { margin: 0; color: #c9ef9a; font-size: clamp(2.3rem, 6vw, 3.7rem); font-variant-numeric: tabular-nums; letter-spacing: -.055em; }
    .divider { height: 1px; border: 0; background: #ffffff24; }
    .total-row { display: flex; justify-content: space-between; gap: 14px; color: #d7e3de; font-size: .9rem; }
    .total-row strong { color: white; font-variant-numeric: tabular-nums; }
    .note { margin: 0; color: #b7cec5; font-size: .82rem; line-height: 1.5; }

    @media (max-width: 680px) {
      .calculator { grid-template-columns: 1fr; }
      .result { min-height: 270px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <p class="eyebrow">Conta justa, sem estresse</p>
      <h1>Divisor de conta</h1>
      <p>Inclua a gorjeta e descubra quanto cada pessoa paga.</p>
    </header>

    <section class="calculator" aria-label="Calculadora de divisão de conta">
      <div class="fields">
        <div class="field">
          <label for="bill">Valor da conta</label>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">R$</span>
            <input id="bill" type="number" min="0" step="0.01" value="120" inputmode="decimal">
          </div>
        </div>

        <div class="field">
          <label>Gorjeta</label>
          <div class="tip-options" role="group" aria-label="Porcentagem de gorjeta">
            <button class="tip-option" type="button" data-tip="0" aria-pressed="false">0%</button>
            <button class="tip-option" type="button" data-tip="10" aria-pressed="false">10%</button>
            <button class="tip-option" type="button" data-tip="12" aria-pressed="true">12%</button>
            <button class="tip-option" type="button" data-tip="15" aria-pressed="false">15%</button>
            <button class="tip-option" type="button" data-tip="20" aria-pressed="false">20%</button>
          </div>
        </div>

        <div class="field">
          <label for="people">Número de pessoas</label>
          <div class="input-wrap">
            <input id="people" type="number" min="1" step="1" value="4" inputmode="numeric">
            <span class="suffix" aria-hidden="true">pessoas</span>
          </div>
        </div>
      </div>

      <aside class="result" aria-live="polite">
        <div>
          <p class="result-label">Cada pessoa paga</p>
          <p id="per-person" class="amount">R$ 33,60</p>
        </div>
        <hr class="divider">
        <div>
          <div class="total-row"><span>Total com gorjeta</span><strong id="total">R$ 134,40</strong></div>
          <div class="total-row" style="margin-top: 12px"><span>Gorjeta</span><strong id="tip-amount">R$ 14,40</strong></div>
        </div>
        <p id="message" class="note">Dividido entre 4 pessoas.</p>
      </aside>
    </section>
  </main>

  <script>
    const billInput = document.querySelector("#bill");
    const peopleInput = document.querySelector("#people");
    const tipButtons = document.querySelectorAll("[data-tip]");
    const perPersonOutput = document.querySelector("#per-person");
    const totalOutput = document.querySelector("#total");
    const tipAmountOutput = document.querySelector("#tip-amount");
    const message = document.querySelector("#message");
    const currency = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    let tipPercentage = 12;

    function calculate() {
      const bill = Number(billInput.value);
      const people = Number(peopleInput.value);
      const validBill = Number.isFinite(bill) && bill >= 0;
      const validPeople = Number.isInteger(people) && people >= 1;

      billInput.setAttribute("aria-invalid", String(!validBill));
      peopleInput.setAttribute("aria-invalid", String(!validPeople));
      if (!validBill || !validPeople) {
        perPersonOutput.textContent = "—";
        totalOutput.textContent = "—";
        tipAmountOutput.textContent = "—";
        message.textContent = !validBill ? "Informe um valor de conta válido." : "Informe pelo menos uma pessoa.";
        return;
      }

      const tipAmount = bill * tipPercentage / 100;
      const total = bill + tipAmount;
      perPersonOutput.textContent = currency.format(total / people);
      totalOutput.textContent = currency.format(total);
      tipAmountOutput.textContent = currency.format(tipAmount);
      message.textContent = `Dividido entre ${people} ${people === 1 ? "pessoa" : "pessoas"}.`;
    }

    billInput.addEventListener("input", calculate);
    peopleInput.addEventListener("input", calculate);
    tipButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tipPercentage = Number(button.dataset.tip);
        tipButtons.forEach((tipButton) => {
          tipButton.setAttribute("aria-pressed", String(tipButton === button));
        });
        calculate();
      });
    });

    calculate();
  </script>
</body>
</html>
